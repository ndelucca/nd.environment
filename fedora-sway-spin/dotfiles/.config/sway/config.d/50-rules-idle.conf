# Inhibición de idle durante video a pantalla completa.
#
# `inhibit_idle fullscreen` solo inhibe el lock por idle mientras la ventana ESTÁ a
# pantalla completa; al salir, el idle del Spin (90-swayidle.conf) vuelve a aplicar.
# Complementa el toggle manual `idle_inhibitor` de waybar.
#
# El Spin ya hace esto para navegadores en /usr/share/sway/config.d/50-rules-browser.conf
# (marca Browser + inhibit_idle), así que firefox NO se repite acá. Chromium sí: la regla
# del Spin matchea app_id="Chromium-browser" (C mayúscula) y el app_id real bajo Wayland
# es "chromium-browser", así que allá no engancha. mpv no lo cubre el Spin.
for_window [app_id="mpv"]              inhibit_idle fullscreen
for_window [app_id="chromium-browser"] inhibit_idle fullscreen
